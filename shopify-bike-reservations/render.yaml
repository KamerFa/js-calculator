# Render Blueprint — deploy with one click
# https://render.com/docs/blueprint-spec

databases:
  - name: bike-reservations-db
    plan: free
    databaseName: bike_reservations
    user: bikeadmin

services:
  - type: web
    name: bike-reservations
    runtime: node
    plan: free
    rootDir: shopify-bike-reservations
    buildCommand: npm install && npm run build
    startCommand: npm run render-start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bike-reservations-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false  # you'll set this manually
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,write_products,read_orders,write_orders,read_draft_orders,write_draft_orders
      - key: SHOPIFY_APP_URL
        sync: false  # set to https://bike-reservations.onrender.com
      - key: HOST
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
    healthCheckPath: /
