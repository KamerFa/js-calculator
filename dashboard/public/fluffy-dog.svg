<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect width="400" height="400" fill="#f0e6d3" rx="20"/>

  <!-- Body fur (shaggy layers) -->
  <ellipse cx="200" cy="290" rx="95" ry="75" fill="#c4956a"/>
  <!-- Shaggy body tufts -->
  <ellipse cx="130" cy="270" rx="30" ry="18" fill="#b8875e" transform="rotate(-15 130 270)"/>
  <ellipse cx="270" cy="270" rx="30" ry="18" fill="#b8875e" transform="rotate(15 270 270)"/>
  <ellipse cx="150" cy="310" rx="25" ry="14" fill="#b8875e" transform="rotate(-10 150 310)"/>
  <ellipse cx="250" cy="310" rx="25" ry="14" fill="#b8875e" transform="rotate(10 250 310)"/>
  <ellipse cx="200" cy="340" rx="28" ry="15" fill="#b8875e"/>
  <ellipse cx="170" cy="250" rx="22" ry="12" fill="#d4a87a" transform="rotate(-20 170 250)"/>
  <ellipse cx="230" cy="250" rx="22" ry="12" fill="#d4a87a" transform="rotate(20 230 250)"/>
  <ellipse cx="200" cy="235" rx="20" ry="10" fill="#d4a87a"/>

  <!-- Front legs -->
  <rect x="155" y="330" width="28" height="45" rx="14" fill="#c4956a"/>
  <rect x="217" y="330" width="28" height="45" rx="14" fill="#c4956a"/>
  <!-- Paws -->
  <ellipse cx="169" cy="375" rx="18" ry="10" fill="#b8875e"/>
  <ellipse cx="231" cy="375" rx="18" ry="10" fill="#b8875e"/>
  <!-- Paw toes -->
  <circle cx="158" cy="377" r="4" fill="#a07050"/>
  <circle cx="169" cy="380" r="4" fill="#a07050"/>
  <circle cx="180" cy="377" r="4" fill="#a07050"/>
  <circle cx="220" cy="377" r="4" fill="#a07050"/>
  <circle cx="231" cy="380" r="4" fill="#a07050"/>
  <circle cx="242" cy="377" r="4" fill="#a07050"/>

  <!-- Tail (fluffy) -->
  <path d="M290 270 Q330 230 320 200 Q315 185 305 190 Q310 210 295 240 Q285 255 290 270Z" fill="#c4956a"/>
  <ellipse cx="318" cy="198" rx="15" ry="12" fill="#d4a87a" transform="rotate(-30 318 198)"/>
  <ellipse cx="310" cy="210" rx="12" ry="8" fill="#b8875e" transform="rotate(-40 310 210)"/>

  <!-- Head -->
  <ellipse cx="200" cy="170" rx="75" ry="65" fill="#c4956a"/>

  <!-- Shaggy head fur tufts -->
  <ellipse cx="145" cy="145" rx="25" ry="15" fill="#d4a87a" transform="rotate(-30 145 145)"/>
  <ellipse cx="255" cy="145" rx="25" ry="15" fill="#d4a87a" transform="rotate(30 255 145)"/>
  <ellipse cx="165" cy="125" rx="20" ry="12" fill="#b8875e" transform="rotate(-15 165 125)"/>
  <ellipse cx="235" cy="125" rx="20" ry="12" fill="#b8875e" transform="rotate(15 235 125)"/>
  <ellipse cx="200" cy="115" rx="22" ry="14" fill="#d4a87a"/>
  <ellipse cx="180" cy="110" rx="18" ry="11" fill="#c4956a" transform="rotate(-10 180 110)"/>
  <ellipse cx="220" cy="110" rx="18" ry="11" fill="#c4956a" transform="rotate(10 220 110)"/>
  <!-- Top floof -->
  <ellipse cx="190" cy="105" rx="15" ry="10" fill="#d4a87a" transform="rotate(-5 190 105)"/>
  <ellipse cx="210" cy="105" rx="15" ry="10" fill="#d4a87a" transform="rotate(5 210 105)"/>
  <ellipse cx="200" cy="100" rx="12" ry="8" fill="#c4956a"/>

  <!-- Cheek fur -->
  <ellipse cx="135" cy="175" rx="20" ry="14" fill="#d4a87a" transform="rotate(-10 135 175)"/>
  <ellipse cx="265" cy="175" rx="20" ry="14" fill="#d4a87a" transform="rotate(10 265 175)"/>
  <ellipse cx="140" cy="190" rx="16" ry="10" fill="#b8875e" transform="rotate(5 140 190)"/>
  <ellipse cx="260" cy="190" rx="16" ry="10" fill="#b8875e" transform="rotate(-5 260 190)"/>

  <!-- Ears (floppy, shaggy) -->
  <!-- Left ear -->
  <ellipse cx="130" cy="130" rx="30" ry="45" fill="#a07050" transform="rotate(15 130 130)"/>
  <ellipse cx="128" cy="120" rx="18" ry="15" fill="#b8875e" transform="rotate(15 128 120)"/>
  <ellipse cx="125" cy="140" rx="15" ry="10" fill="#8e6040" transform="rotate(20 125 140)"/>
  <ellipse cx="135" cy="155" rx="12" ry="8" fill="#b8875e" transform="rotate(10 135 155)"/>
  <!-- Right ear -->
  <ellipse cx="270" cy="130" rx="30" ry="45" fill="#a07050" transform="rotate(-15 270 130)"/>
  <ellipse cx="272" cy="120" rx="18" ry="15" fill="#b8875e" transform="rotate(-15 272 120)"/>
  <ellipse cx="275" cy="140" rx="15" ry="10" fill="#8e6040" transform="rotate(-20 275 140)"/>
  <ellipse cx="265" cy="155" rx="12" ry="8" fill="#b8875e" transform="rotate(-10 265 155)"/>

  <!-- Eye area (lighter fur patches) -->
  <ellipse cx="175" cy="160" rx="22" ry="18" fill="#dbb990"/>
  <ellipse cx="225" cy="160" rx="22" ry="18" fill="#dbb990"/>

  <!-- Eyes -->
  <ellipse cx="175" cy="160" rx="12" ry="13" fill="white"/>
  <ellipse cx="225" cy="160" rx="12" ry="13" fill="white"/>
  <!-- Pupils -->
  <circle cx="178" cy="158" r="7" fill="#2c1810"/>
  <circle cx="228" cy="158" r="7" fill="#2c1810"/>
  <!-- Eye shine -->
  <circle cx="181" cy="155" r="3" fill="white"/>
  <circle cx="231" cy="155" r="3" fill="white"/>
  <circle cx="176" cy="162" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="226" cy="162" r="1.5" fill="white" opacity="0.7"/>
  <!-- Eyebrows (fluffy) -->
  <ellipse cx="175" cy="143" rx="16" ry="5" fill="#b8875e" transform="rotate(-5 175 143)"/>
  <ellipse cx="225" cy="143" rx="16" ry="5" fill="#b8875e" transform="rotate(5 225 143)"/>

  <!-- Nose -->
  <ellipse cx="200" cy="185" rx="12" ry="9" fill="#2c1810"/>
  <ellipse cx="200" cy="183" rx="5" ry="3" fill="#4a3020" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M200 194 Q190 205 183 200" fill="none" stroke="#2c1810" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 194 Q210 205 217 200" fill="none" stroke="#2c1810" stroke-width="2" stroke-linecap="round"/>

  <!-- Tongue -->
  <ellipse cx="200" cy="207" rx="8" ry="12" fill="#e8758a"/>
  <ellipse cx="200" cy="205" rx="5" ry="8" fill="#f09aaa"/>
  <line x1="200" y1="198" x2="200" y2="215" stroke="#d4607a" stroke-width="1" opacity="0.5"/>

  <!-- Chin fur -->
  <ellipse cx="200" cy="220" rx="25" ry="12" fill="#d4a87a"/>
  <ellipse cx="188" cy="218" rx="12" ry="8" fill="#c4956a" transform="rotate(-10 188 218)"/>
  <ellipse cx="212" cy="218" rx="12" ry="8" fill="#c4956a" transform="rotate(10 212 218)"/>
</svg>
