databases:
  - name: dashboard-db
    plan: free
    databaseName: dashboard
    user: dashboard_user

services:
  - type: web
    name: productivity-dashboard
    runtime: node
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-db
          property: connectionString
