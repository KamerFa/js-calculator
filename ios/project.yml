name: Dashboard
options:
  bundleIdPrefix: com.kamerfa
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dashboard:
    type: application
    platform: iOS
    sources:
      - Dashboard
    info:
      path: Dashboard/Info.plist
      properties:
        CFBundleDisplayName: Dashboard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          # Allows http://localhost:3001 during development; production uses HTTPS.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamerfa.dashboard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
