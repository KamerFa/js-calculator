# Shopify Rental App configuration
# See https://shopify.dev/docs/apps/tools/cli/configuration

name = "Rental Manager"
client_id = ""
application_url = "https://your-app.onrender.com"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_customers"

[auth]
redirect_urls = [
  "https://your-app.onrender.com/api/auth/callback",
  "https://localhost:3000/api/auth/callback"
]

[webhooks]
api_version = "2024-04"

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://your-app.onrender.com/api/webhooks/gdpr/customers-data-request"
  customer_deletion_url = "https://your-app.onrender.com/api/webhooks/gdpr/customers-redact"
  shop_deletion_url = "https://your-app.onrender.com/api/webhooks/gdpr/shop-redact"

[app_proxy]
url = "https://your-app.onrender.com/api/storefront"
subpath = "rentals"
prefix = "apps"

[pos]
embedded = false

[[extensions]]
type = "theme_app_extension"
name = "Rental Widget"
handle = "rental-widget"
